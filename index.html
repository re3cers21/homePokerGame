<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poker Night — Blind Timer</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=JetBrains+Mono:wght@400;600;700&family=Cormorant+Garamond:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --felt: #0b7a40;
    --felt-dark: #064d28;
    --felt-deep: #042e18;
    --gold: #d4a843;
    --gold-bright: #f0c95c;
    --gold-dim: #8a6a2a;
    --red: #bf3636;
    --white: #f5f0e8;
    --cream: #ddd4c2;
    --dark: #0e0e0e;
    --input-bg: rgba(0,0,0,0.35);
    --input-border: rgba(212,168,67,0.3);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Cormorant Garamond', serif;
    background: var(--dark);
    color: var(--white);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    overflow-y: auto;
    user-select: none;
  }

  .bg {
    position: fixed; inset: 0; z-index: 0;
    background: radial-gradient(ellipse at 50% 40%, var(--felt) 0%, var(--felt-dark) 50%, var(--felt-deep) 100%);
  }
  .bg::before {
    content: ''; position: absolute; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg width='200' height='200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence baseFrequency='0.85' numOctaves='4' type='fractalNoise'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.08'/%3E%3C/svg%3E");
    opacity: 0.6;
  }
  .bg::after {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 50%, transparent 30%, rgba(0,0,0,0.45) 100%);
  }

  .rail {
    position: fixed; inset: 8px; z-index: 1;
    border: 3px solid var(--gold-dim);
    border-radius: 24px;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.3), 0 0 15px rgba(212,168,67,0.15);
    pointer-events: none;
  }

  .container {
    position: relative; z-index: 2;
    display: flex; flex-direction: column;
    align-items: center; gap: 10px;
    width: 100%; max-width: 600px;
    padding: 24px 20px 40px;
  }

  .title {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: clamp(1.3rem, 4vw, 1.8rem);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--gold);
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }

  .view { display: none; width: 100%; flex-direction: column; align-items: center; gap: 10px; }
  .view.active { display: flex; }

  .level-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem; font-weight: 600;
    letter-spacing: 0.3em; text-transform: uppercase;
    color: var(--cream); opacity: 0.7;
  }
  .level-num {
    font-family: 'Playfair Display', serif;
    font-weight: 900; font-size: clamp(1.2rem, 3vw, 1.6rem);
    color: var(--gold-bright);
  }
  .break-label {
    font-family: 'Playfair Display', serif;
    font-weight: 700; font-size: 1.4rem;
    color: var(--gold-bright);
    animation: pulse-glow 2s ease-in-out infinite;
  }

  .blinds-box {
    background: rgba(0,0,0,0.35);
    border: 2px solid var(--gold-dim);
    border-radius: 16px;
    padding: 18px 36px; text-align: center;
    box-shadow: inset 0 2px 12px rgba(0,0,0,0.3);
    width: 100%; max-width: 440px;
  }
  .blinds-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem; letter-spacing: 0.4em;
    text-transform: uppercase; color: var(--cream); opacity: 0.55;
    margin-bottom: 6px;
  }
  .blinds-values {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700; font-size: clamp(2rem, 8vw, 3.6rem);
    color: var(--white); text-shadow: 0 0 20px rgba(255,255,255,0.15);
    line-height: 1;
  }
  .blinds-values .sep { color: var(--gold); margin: 0 6px; font-weight: 400; }

  .timer-wrap {
    position: relative;
    width: clamp(170px, 42vw, 230px);
    height: clamp(170px, 42vw, 230px);
    margin: 6px 0;
  }
  .timer-ring { width: 100%; height: 100%; transform: rotate(-90deg); }
  .timer-ring-bg { fill: none; stroke: rgba(255,255,255,0.08); stroke-width: 6; }
  .timer-ring-fg {
    fill: none; stroke: var(--gold); stroke-width: 6;
    stroke-linecap: round; transition: stroke-dashoffset 1s linear, stroke 0.5s ease;
    filter: drop-shadow(0 0 6px rgba(212,168,67,0.4));
  }
  .timer-ring-fg.warning { stroke: var(--red); filter: drop-shadow(0 0 10px rgba(191,54,54,0.6)); }

  .timer-text {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700; font-size: clamp(2.2rem, 8vw, 3rem);
    color: var(--white); text-shadow: 0 2px 10px rgba(0,0,0,0.5);
  }

  .next-level {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem; color: var(--cream); opacity: 0.5;
    text-align: center; letter-spacing: 0.05em;
  }

  .controls { display: flex; gap: 10px; margin-top: 6px; flex-wrap: wrap; justify-content: center; }

  .btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem; font-weight: 600;
    letter-spacing: 0.12em; text-transform: uppercase;
    border: 2px solid var(--gold-dim);
    background: rgba(0,0,0,0.3); color: var(--gold);
    padding: 10px 20px; border-radius: 8px;
    cursor: pointer; transition: all 0.2s ease;
  }
  .btn:hover { background: var(--gold-dim); color: var(--dark); box-shadow: 0 0 14px rgba(212,168,67,0.3); }
  .btn:active { transform: scale(0.96); }
  .btn.primary { background: var(--gold); color: var(--dark); border-color: var(--gold); font-size: 0.78rem; padding: 11px 28px; }
  .btn.primary:hover { background: var(--gold-bright); box-shadow: 0 0 20px rgba(212,168,67,0.4); }
  .btn.danger { border-color: var(--red); color: var(--red); }
  .btn.danger:hover { background: var(--red); color: var(--white); }

  .schedule-toggle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem; letter-spacing: 0.15em;
    text-transform: uppercase; color: var(--cream);
    opacity: 0.5; cursor: pointer; margin-top: 4px;
    border: none; background: none; transition: opacity 0.2s;
  }
  .schedule-toggle:hover { opacity: 0.9; }

  .schedule {
    display: none; width: 100%; max-width: 440px;
    background: rgba(0,0,0,0.4); border: 1px solid rgba(212,168,67,0.2);
    border-radius: 12px; padding: 12px 16px; margin-top: 4px;
    max-height: 200px; overflow-y: auto;
  }
  .schedule.open { display: block; }
  .schedule table { width: 100%; border-collapse: collapse; font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; }
  .schedule th { text-align: left; color: var(--gold); font-weight: 600; padding: 3px 6px; letter-spacing: 0.1em; text-transform: uppercase; font-size: 0.55rem; border-bottom: 1px solid rgba(212,168,67,0.2); }
  .schedule td { padding: 4px 6px; color: var(--cream); opacity: 0.7; }
  .schedule tr.active td { color: var(--gold-bright); opacity: 1; font-weight: 700; }
  .schedule tr.past td { opacity: 0.3; text-decoration: line-through; }
  .schedule tr.break-row td { color: var(--gold); font-style: italic; }

  .flash {
    position: fixed; inset: 0; z-index: 100;
    background: var(--gold); opacity: 0; pointer-events: none;
    transition: opacity 0.15s ease;
  }
  .flash.active { opacity: 0.25; }

  @keyframes pulse-glow { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

  .schedule::-webkit-scrollbar { width: 4px; }
  .schedule::-webkit-scrollbar-track { background: transparent; }
  .schedule::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 2px; }

  .players-info {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem; color: var(--cream); opacity: 0.4;
    letter-spacing: 0.1em; margin-top: 2px;
  }

  /* ─── Settings ─── */
  .settings-panel {
    width: 100%; max-width: 480px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .settings-section {
    background: rgba(0,0,0,0.35);
    border: 1px solid var(--input-border);
    border-radius: 14px; padding: 18px 20px;
  }
  .settings-section-title {
    font-family: 'Playfair Display', serif;
    font-weight: 700; font-size: 1rem;
    color: var(--gold); margin-bottom: 14px;
    letter-spacing: 0.05em;
  }
  .field-row {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 10px; flex-wrap: wrap;
  }
  .field-row:last-child { margin-bottom: 0; }
  .field-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem; color: var(--cream);
    opacity: 0.7; min-width: 110px;
    letter-spacing: 0.04em;
  }
  .field-input {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem; font-weight: 600;
    background: var(--input-bg);
    border: 1.5px solid var(--input-border);
    color: var(--white); border-radius: 8px;
    padding: 8px 12px; width: 90px;
    text-align: center; outline: none;
    transition: border-color 0.2s;
  }
  .field-input:focus { border-color: var(--gold); }
  select.field-input {
    width: auto; min-width: 120px;
    appearance: none;
    background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 0l5 6 5-6z' fill='%23d4a843'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 10px center;
    padding-right: 28px; cursor: pointer;
  }
  select.field-input option { background: #1a2e1a; color: var(--white); }

  .checkbox-row {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 10px;
  }
  .checkbox-row input[type="checkbox"] {
    accent-color: var(--gold); width: 16px; height: 16px; cursor: pointer;
  }

  .volume-slider {
    -webkit-appearance: none; appearance: none;
    width: 120px; height: 4px;
    background: var(--input-border); border-radius: 2px; outline: none;
  }
  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px;
    background: var(--gold); border-radius: 50%; cursor: pointer;
    box-shadow: 0 0 6px rgba(212,168,67,0.4);
  }

  .test-sound-btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem; padding: 5px 12px;
    border: 1.5px solid var(--input-border);
    background: var(--input-bg); color: var(--cream);
    border-radius: 6px; cursor: pointer;
    transition: all 0.15s; letter-spacing: 0.06em;
  }
  .test-sound-btn:hover { border-color: var(--gold); color: var(--gold); }

  /* Level editor */
  .level-table {
    width: 100%; border-collapse: collapse;
    font-family: 'JetBrains Mono', monospace; font-size: 0.68rem;
  }
  .level-table th {
    text-align: center; color: var(--gold); font-weight: 600;
    padding: 4px 4px 8px; font-size: 0.55rem;
    letter-spacing: 0.1em; text-transform: uppercase;
    border-bottom: 1px solid rgba(212,168,67,0.2);
  }
  .level-table td { padding: 4px 3px; text-align: center; }
  .level-table .row-input {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem; font-weight: 600;
    background: var(--input-bg); border: 1.5px solid var(--input-border);
    color: var(--white); border-radius: 6px;
    padding: 6px 4px; width: 100%;
    text-align: center; outline: none; transition: border-color 0.2s;
  }
  .level-table .row-input:focus { border-color: var(--gold); }
  .level-table .break-cell {
    color: var(--gold); font-style: italic; font-size: 0.65rem; opacity: 0.8;
  }

  .row-actions { display: flex; gap: 3px; justify-content: center; }
  .row-btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem; font-weight: 700;
    width: 24px; height: 24px; border-radius: 5px;
    border: 1.5px solid var(--input-border);
    background: var(--input-bg); color: var(--cream);
    cursor: pointer; display: flex; align-items: center;
    justify-content: center; transition: all 0.15s;
  }
  .row-btn:hover { border-color: var(--gold); color: var(--gold); }
  .row-btn.del:hover { border-color: var(--red); color: var(--red); }

  .add-level-row { display: flex; gap: 8px; margin-top: 10px; justify-content: center; }
</style>
</head>
<body>

<div class="bg"></div>
<div class="rail"></div>
<div class="flash" id="flash"></div>

<div class="container">
  <div class="title">♠ Poker Night ♠</div>

  <!-- TIMER VIEW -->
  <div class="view active" id="timerView">
    <div id="levelArea">
      <div class="level-label">Level</div>
      <div class="level-num" id="levelNum">1</div>
    </div>
    <div class="blinds-box">
      <div class="blinds-title">Blinds</div>
      <div class="blinds-values" id="blindsDisplay">
        <span id="sb">25</span><span class="sep">/</span><span id="bb">50</span>
      </div>
    </div>
    <div class="timer-wrap">
      <svg class="timer-ring" viewBox="0 0 200 200">
        <circle class="timer-ring-bg" cx="100" cy="100" r="88" />
        <circle class="timer-ring-fg" id="timerRing" cx="100" cy="100" r="88" />
      </svg>
      <div class="timer-text" id="timerText">15:00</div>
    </div>
    <div class="next-level" id="nextLevel">Next: 50 / 100</div>
    <div class="controls">
      <button class="btn primary" id="startBtn" onclick="toggleTimer()">Start</button>
      <button class="btn" onclick="skipLevel()">Skip ▸</button>
      <button class="btn" onclick="showSettings()">⚙ Settings</button>
      <button class="btn danger" onclick="resetTimer()">Reset</button>
    </div>
    <button class="schedule-toggle" onclick="toggleSchedule()">▾ Full Schedule</button>
    <div class="schedule" id="schedule"></div>
    <div class="players-info" id="playersInfo">10 Players · Tournament · ~2 hrs</div>
  </div>

  <!-- SETTINGS VIEW -->
  <div class="view" id="settingsView">
    <div class="settings-panel">
      <div class="settings-section">
        <div class="settings-section-title">Game Info</div>
        <div class="field-row">
          <span class="field-label">Players</span>
          <input class="field-input" type="number" id="sPlayers" min="2" max="20" value="10">
        </div>
        <div class="field-row">
          <span class="field-label">Format</span>
          <select class="field-input" id="sFormat">
            <option value="tournament">Tournament</option>
            <option value="cash">Cash Game</option>
          </select>
        </div>
      </div>

      <div class="settings-section">
        <div class="settings-section-title">Sound</div>
        <div class="checkbox-row">
          <input type="checkbox" id="sSoundOn" checked>
          <span class="field-label" style="min-width:auto">Sound alerts on</span>
        </div>
        <div class="field-row">
          <span class="field-label">Warning at</span>
          <select class="field-input" id="sWarnTime">
            <option value="60">60 sec</option>
            <option value="30" selected>30 sec</option>
            <option value="15">15 sec</option>
            <option value="10">10 sec</option>
          </select>
        </div>
        <div class="field-row">
          <span class="field-label">Volume</span>
          <input class="volume-slider" type="range" id="sVolume" min="0" max="100" value="60">
          <button class="test-sound-btn" onclick="testSound()">Test ▸</button>
        </div>
      </div>

      <div class="settings-section">
        <div class="settings-section-title">Blind Schedule</div>
        <table class="level-table">
          <thead><tr><th>#</th><th>Small</th><th>Big</th><th>Min</th><th></th></tr></thead>
          <tbody id="levelTableBody"></tbody>
        </table>
        <div class="add-level-row">
          <button class="btn" onclick="addLevel(false)" style="font-size:0.6rem;padding:7px 14px">+ Level</button>
          <button class="btn" onclick="addLevel(true)" style="font-size:0.6rem;padding:7px 14px">+ Break</button>
        </div>
      </div>

      <div class="controls">
        <button class="btn primary" onclick="saveSettings()">Save & Return</button>
        <button class="btn" onclick="cancelSettings()">Cancel</button>
      </div>
    </div>
  </div>
</div>

<script>
  // ─── State ───
  let levels = [
    { sb: 25,  bb: 50,   mins: 15 },
    { sb: 50,  bb: 100,  mins: 15 },
    { sb: 75,  bb: 150,  mins: 15 },
    { sb: 100, bb: 200,  mins: 15 },
    { isBreak: true, mins: 5 },
    { sb: 150, bb: 300,  mins: 15 },
    { sb: 200, bb: 400,  mins: 15 },
    { sb: 300, bb: 600,  mins: 15 },
    { sb: 500, bb: 1000, mins: 15 },
  ];

  let settings = { players: 10, format: 'tournament', soundOn: true, warnTime: 30, volume: 60 };
  let currentLevelIdx = 0;
  let totalSeconds = levels[0].mins * 60;
  let remainingSeconds = totalSeconds;
  let timerInterval = null;
  let isRunning = false;

  const circumference = 2 * Math.PI * 88;
  const ring = document.getElementById('timerRing');
  ring.style.strokeDasharray = circumference;
  ring.style.strokeDashoffset = 0;

  // ─── Audio ───
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  function vol() { return (settings.volume / 100) * 0.5; }

  function beep(freq, dur, count = 1, gap = 200) {
    if (!settings.soundOn) return;
    ensureAudio();
    const v = vol();
    for (let i = 0; i < count; i++) {
      setTimeout(() => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'sine'; o.frequency.value = freq;
        g.gain.setValueAtTime(v, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur / 1000);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + dur / 1000);
      }, i * (dur + gap));
    }
  }

  function levelUpAlarm() {
    if (!settings.soundOn) return;
    ensureAudio();
    const v = vol();
    // Rising fanfare: C5 → E5 → G5 → C6
    [523, 659, 784, 1047].forEach((freq, i) => {
      setTimeout(() => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = i < 3 ? 'sine' : 'triangle';
        o.frequency.value = freq;
        g.gain.setValueAtTime(v * 0.9, audioCtx.currentTime);
        g.gain.setValueAtTime(v * 0.9, audioCtx.currentTime + 0.15);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.45);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + 0.45);
      }, i * 150);
    });
    // Sustained chord
    setTimeout(() => {
      [1047, 1319, 1568].forEach(freq => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'sine'; o.frequency.value = freq;
        g.gain.setValueAtTime(v, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + 1.2);
      });
    }, 4 * 150);
  }

  function testSound() {
    ensureAudio();
    settings.volume = parseInt(document.getElementById('sVolume').value);
    settings.soundOn = document.getElementById('sSoundOn').checked;
    levelUpAlarm();
  }

  // ─── Timer ───
  function fmt(s) { return `${Math.floor(s/60)}:${(s%60).toString().padStart(2,'0')}`; }

  function updateDisplay() {
    const lv = levels[currentLevelIdx];
    const la = document.getElementById('levelArea');
    if (lv.isBreak) {
      la.innerHTML = `<div class="break-label">\u2615 Break</div>`;
      document.getElementById('sb').textContent = '\u2014';
      document.getElementById('bb').textContent = '\u2014';
      document.querySelector('.blinds-title').textContent = 'Take a breather';
    } else {
      const dn = levels.slice(0, currentLevelIdx + 1).filter(l => !l.isBreak).length;
      la.innerHTML = `<div class="level-label">Level</div><div class="level-num">${dn}</div>`;
      document.getElementById('sb').textContent = lv.sb.toLocaleString();
      document.getElementById('bb').textContent = lv.bb.toLocaleString();
      document.querySelector('.blinds-title').textContent = 'Blinds';
    }
    document.getElementById('timerText').textContent = fmt(remainingSeconds);
    ring.style.strokeDashoffset = circumference * (1 - remainingSeconds / totalSeconds);
    ring.classList.toggle('warning', remainingSeconds <= 30 && remainingSeconds > 0);

    const ni = currentLevelIdx + 1;
    const ne = document.getElementById('nextLevel');
    if (ni < levels.length) {
      const n = levels[ni];
      ne.textContent = n.isBreak ? `Next: Break (${n.mins} min)` : `Next: ${n.sb.toLocaleString()} / ${n.bb.toLocaleString()}`;
    } else { ne.textContent = 'Final Level'; }

    const tm = levels.reduce((s,l) => s + l.mins, 0);
    document.getElementById('playersInfo').textContent =
      `${settings.players} Players \u00b7 ${settings.format === 'tournament' ? 'Tournament' : 'Cash Game'} \u00b7 ~${(tm/60).toFixed(1)} hrs`;
    renderSchedule();
  }

  function toggleTimer() {
    ensureAudio();
    if (isRunning) {
      clearInterval(timerInterval); isRunning = false;
      document.getElementById('startBtn').textContent = 'Resume';
    } else {
      isRunning = true;
      document.getElementById('startBtn').textContent = 'Pause';
      timerInterval = setInterval(tick, 1000);
    }
  }

  function tick() {
    remainingSeconds--;
    if (remainingSeconds <= 0) { advanceLevel(); }
    else if (remainingSeconds === settings.warnTime) { beep(600, 150, 2, 180); }
    else if (remainingSeconds === 10 && settings.warnTime > 10) { beep(800, 100, 3, 140); }
    updateDisplay();
  }

  function advanceLevel() {
    if (currentLevelIdx >= levels.length - 1) {
      clearInterval(timerInterval); isRunning = false;
      document.getElementById('timerText').textContent = 'DONE';
      document.getElementById('startBtn').textContent = 'Start';
      levelUpAlarm(); return;
    }
    document.getElementById('flash').classList.add('active');
    setTimeout(() => document.getElementById('flash').classList.remove('active'), 350);
    levelUpAlarm();
    currentLevelIdx++;
    totalSeconds = levels[currentLevelIdx].mins * 60;
    remainingSeconds = totalSeconds;
    updateDisplay();
  }

  function skipLevel() { ensureAudio(); remainingSeconds = 0; if (!isRunning) { advanceLevel(); updateDisplay(); } }

  function resetTimer() {
    clearInterval(timerInterval); isRunning = false;
    currentLevelIdx = 0;
    totalSeconds = levels[0].mins * 60;
    remainingSeconds = totalSeconds;
    document.getElementById('startBtn').textContent = 'Start';
    ring.classList.remove('warning');
    updateDisplay();
  }

  function toggleSchedule() { document.getElementById('schedule').classList.toggle('open'); }

  function renderSchedule() {
    let h = '<table><tr><th>Lvl</th><th>Small</th><th>Big</th><th>Time</th></tr>';
    let c = 0;
    levels.forEach((lv, i) => {
      let cls = i < currentLevelIdx ? 'past' : i === currentLevelIdx ? 'active' : '';
      if (lv.isBreak) {
        h += `<tr class="${cls} break-row"><td>\u2615</td><td colspan="2">Break</td><td>${lv.mins}m</td></tr>`;
      } else {
        c++;
        h += `<tr class="${cls}"><td>${c}</td><td>${lv.sb}</td><td>${lv.bb}</td><td>${lv.mins}m</td></tr>`;
      }
    });
    document.getElementById('schedule').innerHTML = h + '</table>';
  }

  // ─── Settings ───
  let editLevels = [];

  function showSettings() {
    if (isRunning) toggleTimer();
    editLevels = levels.map(l => ({...l}));
    document.getElementById('sPlayers').value = settings.players;
    document.getElementById('sFormat').value = settings.format;
    document.getElementById('sSoundOn').checked = settings.soundOn;
    document.getElementById('sWarnTime').value = settings.warnTime;
    document.getElementById('sVolume').value = settings.volume;
    renderLevelTable();
    document.getElementById('timerView').classList.remove('active');
    document.getElementById('settingsView').classList.add('active');
  }

  function cancelSettings() {
    document.getElementById('settingsView').classList.remove('active');
    document.getElementById('timerView').classList.add('active');
  }

  function saveSettings() {
    settings.players = parseInt(document.getElementById('sPlayers').value) || 10;
    settings.format = document.getElementById('sFormat').value;
    settings.soundOn = document.getElementById('sSoundOn').checked;
    settings.warnTime = parseInt(document.getElementById('sWarnTime').value);
    settings.volume = parseInt(document.getElementById('sVolume').value);
    readLevelInputs();
    levels = editLevels.map(l => ({...l}));
    resetTimer();
    document.getElementById('settingsView').classList.remove('active');
    document.getElementById('timerView').classList.add('active');
  }

  function readLevelInputs() {
    editLevels = [];
    document.querySelectorAll('#levelTableBody tr').forEach(row => {
      const isBreak = row.dataset.brk === '1';
      const mins = parseInt(row.querySelector('.mins-input').value) || 5;
      if (isBreak) {
        editLevels.push({ isBreak: true, mins });
      } else {
        editLevels.push({
          sb: parseInt(row.querySelector('.sb-input').value) || 25,
          bb: parseInt(row.querySelector('.bb-input').value) || 50,
          mins
        });
      }
    });
  }

  function renderLevelTable() {
    let h = '', n = 0;
    editLevels.forEach((lv, i) => {
      if (lv.isBreak) {
        h += `<tr data-brk="1">
          <td><span class="break-cell">\u2615</span></td>
          <td colspan="2"><span class="break-cell">Break</span></td>
          <td><input class="row-input mins-input" type="number" min="1" max="60" value="${lv.mins}" style="width:48px"></td>
          <td><div class="row-actions">
            <button class="row-btn" onclick="moveLevel(${i},-1)">\u2191</button>
            <button class="row-btn" onclick="moveLevel(${i},1)">\u2193</button>
            <button class="row-btn del" onclick="removeLevel(${i})">\u00d7</button>
          </div></td></tr>`;
      } else {
        n++;
        h += `<tr data-brk="0">
          <td style="color:var(--cream);opacity:0.5">${n}</td>
          <td><input class="row-input sb-input" type="number" min="1" value="${lv.sb}" style="width:62px"></td>
          <td><input class="row-input bb-input" type="number" min="1" value="${lv.bb}" style="width:62px"></td>
          <td><input class="row-input mins-input" type="number" min="1" max="60" value="${lv.mins}" style="width:48px"></td>
          <td><div class="row-actions">
            <button class="row-btn" onclick="moveLevel(${i},-1)">\u2191</button>
            <button class="row-btn" onclick="moveLevel(${i},1)">\u2193</button>
            <button class="row-btn del" onclick="removeLevel(${i})">\u00d7</button>
          </div></td></tr>`;
      }
    });
    document.getElementById('levelTableBody').innerHTML = h;
  }

  function addLevel(isBreak) {
    readLevelInputs();
    if (isBreak) { editLevels.push({ isBreak: true, mins: 5 }); }
    else {
      const last = [...editLevels].reverse().find(l => !l.isBreak);
      const sb = last ? last.bb : 25;
      editLevels.push({ sb, bb: sb * 2, mins: 15 });
    }
    renderLevelTable();
  }

  function removeLevel(i) {
    readLevelInputs();
    if (editLevels.length <= 1) return;
    editLevels.splice(i, 1);
    renderLevelTable();
  }

  function moveLevel(i, dir) {
    readLevelInputs();
    const t = i + dir;
    if (t < 0 || t >= editLevels.length) return;
    [editLevels[i], editLevels[t]] = [editLevels[t], editLevels[i]];
    renderLevelTable();
  }

  updateDisplay();
</script>
</body>
</html>
